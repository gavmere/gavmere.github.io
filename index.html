<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gavin Meregillano — Interactive Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>
  <!-- Subtle Floating Studio HUD -->
  <header class="hud-bar">
    <div class="hud-brand" id="hud-home-btn" role="button" tabindex="0" title="Inspect Gavin's profile">
      <span class="status-led" aria-hidden="true"></span>
      <div class="hud-identity">
        <span class="hud-name" id="hud-name-text">Gavin Meregillano</span>
        <span class="hud-role" id="hud-role-text">Identity Infra at Google / YouTube</span>
      </div>
    </div>

    <div class="hud-controls">
      <button type="button" id="btn-xray" class="hud-btn" title="Show clickable hints in the room">
        <span class="hud-btn-dot" aria-hidden="true"></span> Hints
      </button>
      <button type="button" id="btn-lighting" class="hud-btn hud-icon-btn" title="Switch to dark mode" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      </button>
      <button type="button" id="btn-mobile-zoom" class="hud-btn mobile-only-btn" title="Zoom in and pan across desk">
        🔍 Zoom
      </button>
      <div class="hud-counter" id="discovery-counter" title="Items explored">
        0 / 16
      </div>
    </div>
  </header>

  <!-- Floating Hover Tag (follows cursor over interactive objects) -->
  <div id="hover-tooltip" class="hover-tooltip" aria-hidden="true"></div>

  <!-- Main Interactive Battle-Station Canvas -->
  <main class="stage" id="stage">
    <svg
      id="setup-svg"
      viewBox="120 -12 960 724"
      preserveAspectRatio="xMidYMid meet"
      aria-label="Gavin Meregillano interactive desk setup"
    >
      <defs>
        <!-- Subtle Xreart / Architectural Millimeter Wall Grid -->
        <pattern id="wall-grid" width="28" height="28" patternUnits="userSpaceOnUse">
          <path d="M 28 0 L 0 0 0 28" fill="none" class="grid-line" stroke-width="1" />
        </pattern>
        <pattern id="wall-subgrid" width="140" height="140" patternUnits="userSpaceOnUse">
          <rect width="140" height="140" fill="url(#wall-grid)" />
          <path d="M 140 0 L 0 0 0 140" fill="none" class="grid-major-line" stroke-width="1.2" />
        </pattern>
        <pattern id="pc-white-mesh" width="5" height="5" patternUnits="userSpaceOnUse">
          <circle cx="2.5" cy="2.5" r="0.95" fill="rgba(100, 116, 139, 0.34)" />
        </pattern>

        <!-- Subtle 3% Monochromatic Print/Studio Grain -->
        <filter id="film-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch" result="noise" />
          <feColorMatrix type="saturate" values="0" in="noise" result="monoNoise" />
          <feComponentTransfer in="monoNoise" result="softNoise">
            <feFuncA type="linear" slope="0.032" />
          </feComponentTransfer>
        </filter>

        <!-- Gradients -->
        <radialGradient id="wall-keylight" cx="50%" cy="42%" r="55%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="desk-surface-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="100%" stop-color="#ffffff" />
        </linearGradient>

        <linearGradient id="pc-glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.38" />
          <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.12" />
          <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.28" />
        </linearGradient>

        <linearGradient id="main-screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0f172a" />
          <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>

        <linearGradient id="vert-screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#090d16" />
          <stop offset="100%" stop-color="#111827" />
        </linearGradient>

        <linearGradient id="ps5-blueprint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0d3b66" />
          <stop offset="100%" stop-color="#06213d" />
        </linearGradient>

        <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#334155" />
          <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>
      </defs>

      <!-- ================= 0. STUDIO ROOM ARCHITECTURE (INFINITE FULL-BLEED) ================= -->
      <!-- Wall -->
      <rect x="-3000" y="-2400" width="7200" height="3024" class="room-wall" />
      <rect x="-3000" y="-2400" width="7200" height="3024" fill="url(#wall-subgrid)" />
      <rect x="-1200" y="-900" width="3600" height="2200" fill="url(#wall-keylight)" class="day-keylight" />

      <!-- Crisp Flat Ambient Backplate Behind Monitors (No Gaussian Blur) -->
      <rect x="422" y="242" width="414" height="220" rx="28" class="monitor-ambient-glow" opacity="0.45" />

      <!-- Baseboard Molding & Floor -->
      <rect x="-3000" y="624" width="7200" height="12" class="room-baseboard" />
      <line x1="-3000" y1="624" x2="4200" y2="624" class="room-baseboard-top" stroke-width="1.5" />
      <rect x="-3000" y="636" width="7200" height="2400" class="room-floor" />
      <line x1="-3000" y1="636" x2="4200" y2="636" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" />

      <!-- Flat Pill-Shaped Ground Contact Silhouettes (Hard-Edged Vector) -->
      <rect x="190" y="661" width="96" height="8" rx="4" fill="#1e2028" opacity="0.16" />
      <rect x="914" y="661" width="96" height="8" rx="4" fill="#1e2028" opacity="0.16" />
      <rect x="506" y="681" width="164" height="12" rx="6" fill="#1e2028" opacity="0.18" />

      <!-- ================= 1. WALL TROPHIES (CENTERED AROUND X=600) ================= -->
      <!--
        TOP SHELF (x=475..725, y=106, center 600):
          Left:  Noogler Hat on Floating Shelf  (center 538)
          Right: YouTube Creator Play Plaque    (center 662)
        TRIPTYCH ROW (y=140..214, 116x74 each, 28px gap):
          Left:   Cadence Silicon Chip Teardown (x=398..514, center 456)
          Center: S&P Global Stock Ticker       (x=542..658, center 600)
          Right:  PS5 DualSense Teardown        (x=686..802, center 744)
        WALL BADGE:
          UCSD Triton Plaque                    (x=352..412, y=262..322, center 382,292)
      -->

      <!-- 1. GOOGLE NOOGLER HAT + YOUTUBE PLAQUE (Single Centered Shelf) -->
      <g class="clickable-item" data-id="google" data-label="Google / YouTube — Identity Infra" tabindex="0" role="button">
        <g>
          <!-- Hard-Edged Offset Solid Shadow Behind Shelf -->
          <rect x="481" y="112" width="250" height="10" rx="2.5" fill="#1e2028" opacity="0.16" />

          <rect x="475" y="106" width="250" height="10" rx="2.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" />
          <line x1="477" y1="113.5" x2="723" y2="113.5" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />

          <!-- Shelf Contact Shadows -->
          <ellipse cx="538" cy="106" rx="34" ry="1.4" fill="#1e2028" opacity="0.16" />
          <ellipse cx="662" cy="106" rx="18" ry="1.4" fill="#1e2028" opacity="0.18" />

          <!-- Noogler Cap (Seated Cleanly on Shelf Top y=106) -->
          <g transform="translate(538, 106)">
            <!-- Blue Left Panel -->
            <path d="M-36 -3.5 C-36 -28, -14 -38, 0 -38 C-10 -34, -17 -20, -17 -3.5 Z" fill="#3b82f6" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />
            <!-- Red Right Panel -->

            <!-- Center Yellow Panel -->
            <path d="M-17 -3.5 C-17 -20, -10 -34, 0 -38 C10 -34, 17 -20, 17 -3.5 Z" fill="#facc15" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />
            <!-- Subtle Crown Sheen -->
            <path d="M-29 -12 C-27 -24, -18 -31, -8 -34" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-linecap="round" />

            <!-- Green Brim Seated Flush on Shelf Top -->
            <path d="M-40 -0.3 C-40 -5, -18 -6.5, 0 -6.5 C18 -6.5, 40 -5, 40 -0.3 Q0 0.3 -40 -0.3 Z" fill="#22a559" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />

            <!-- Compact Propeller Spindle & Finial Cap -->
            <ellipse cx="0" cy="-38" rx="4.2" ry="2.1" fill="#1e293b" />
            <line x1="0" y1="-39" x2="0" y2="-49" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />
            <circle cx="0" cy="-43" r="2.1" fill="#facc15" stroke="#1e293b" stroke-width="0.9" />
            <!-- Outer translate keeps propeller at top; inner group animates scaleX -->
            <g transform="translate(0, -47.5)">
              <g class="propeller-spin">
                <path d="M0 0 C-6.5 -3.5, -16 -4.2, -18 -0.8 C-19 2, -8.5 2.5, 0 0 Z" fill="#3b82f6" stroke="#1e293b" stroke-width="0.9" />
                <path d="M0 0 C6.5 3.5, 16 4.2, 18 0.8 C19 -2, 8.5 -2.5, 0 0 Z" fill="#60a5fa" stroke="#1e293b" stroke-width="0.9" />
                <circle cx="0" cy="0" r="2.2" fill="#1e40af" />
              </g>
            </g>
            <!-- Top Green Finial Cap (Covers Spindle Tip) -->
            <circle cx="0" cy="-50.2" r="2.2" fill="#22a559" stroke="#1e293b" stroke-width="0.9" />
          </g>

          <!-- YouTube Logo Plaque (Right Half of Shelf, Visible Brushed-Slate Stand) -->
          <g transform="translate(662, 70)">
            <!-- Hard-Edged Offset Wall Shadow (Behind Stand & Plaque) -->
            <g transform="translate(5, 5) scale(1.04) translate(-34, -24)" opacity="0.18">
              <path
                d="M66.52,7.74c-0.78-2.93-2.49-5.41-5.42-6.19C55.79,.13,34,0,34,0S12.21,.13,6.9,1.55 C3.97,2.33,2.27,4.81,1.48,7.74C0.06,13.05,0,24,0,24s0.06,10.95,1.48,16.26c0.78,2.93,2.49,5.41,5.42,6.19 C12.21,47.87,34,48,34,48s21.79-0.13,27.1-1.55c2.93-0.78,4.64-3.26,5.42-6.19C67.94,34.95,68,24,68,24S67.94,13.05,66.52,7.74z"
                fill="#1e2028"
              />
            </g>

            <!-- Visible Pedestal Neck & Base Seated at Shelf Top (y=+36) -->
            <rect x="-4" y="23" width="8" height="10" fill="#475569" stroke="#1e293b" stroke-width="1.2" />
            <line x1="-1.8" y1="24.2" x2="-1.8" y2="32" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" />
            <rect x="-18" y="32.5" width="36" height="3.5" rx="1.5" fill="#334155" stroke="#1e293b" stroke-width="1.2" />

            <!-- Official YouTube Red Plaque with Crisp Bevel & Sheen -->
            <g transform="scale(1.04) translate(-34, -24)">
              <path
                d="M66.52,7.74c-0.78-2.93-2.49-5.41-5.42-6.19C55.79,.13,34,0,34,0S12.21,.13,6.9,1.55 C3.97,2.33,2.27,4.81,1.48,7.74C0.06,13.05,0,24,0,24s0.06,10.95,1.48,16.26c0.78,2.93,2.49,5.41,5.42,6.19 C12.21,47.87,34,48,34,48s21.79-0.13,27.1-1.55c2.93-0.78,4.64-3.26,5.42-6.19C67.94,34.95,68,24,68,24S67.94,13.05,66.52,7.74z"
                fill="#f01010"
                stroke="#991b1b"
                stroke-width="1.15"
              />
              <path d="M7.5 11 C8 6 10.5 4.2 18 3.2 C26 2.3 42 2.3 50 3.2" fill="none" stroke="rgba(255,255,255,0.34)" stroke-width="1.3" stroke-linecap="round" />
              <path d="M 44,24 27,14.5 27,33.5 Z" fill="#FFFFFF" />
            </g>
          </g>
        </g>
        <circle cx="600" cy="78" r="6" class="xray-pin" />
      </g>

      <!-- 2A. CADENCE — EDA SILICON & PCB TEARDOWN FRAME (Bottom-Left, Hard-Edged Offset Shadow) -->
      <g class="clickable-item" data-id="cadence" data-label="Cadence Design Systems" tabindex="0" role="button">
        <g>
          <rect x="404" y="146" width="116" height="74" rx="4" fill="#1e2028" opacity="0.2" />
          <!-- Matte Black Frame + Deep EDA / PCB Shadowbox Backing -->
          <rect x="398" y="140" width="116" height="74" rx="4" fill="#18181b" stroke="#09090b" stroke-width="1.2" />
          <rect x="405" y="147" width="102" height="60" rx="2" fill="#091514" stroke="#13332e" stroke-width="1" />

          <!-- Minimal Corner Fiducial Ticks -->
          <path d="M411 156 V152 H415 M497 152 H501 V156 M411 198 V202 H415 M497 202 H501 V198" fill="none" stroke="rgba(52,211,153,0.38)" stroke-width="1" stroke-linecap="round" />

          <!-- Centered Multi-Core SoC & Crisp EDA Routing Traces -->
          <g transform="translate(456, 177)">
            <!-- 45-Degree PCB Bus Traces -->
            <g fill="none" stroke="#10b981" stroke-width="1.25" opacity="0.65" stroke-linecap="round" stroke-linejoin="round">
              <path d="M-16 -8 H-26 L-32 -14 H-39" />
              <path d="M-16 0 H-39" />
              <path d="M-16 8 H-26 L-32 14 H-39" />
              <path d="M16 -8 H26 L32 -14 H39" />
              <path d="M16 0 H39" />
              <path d="M16 8 H26 L32 14 H39" />
            </g>
            <!-- Gold High-Speed Vertical Differential Traces -->
            <g fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.88" stroke-linecap="round">
              <path d="M-5 -16 V-23" />
              <path d="M5 -16 V-23" />
              <path d="M-5 16 V23" />
              <path d="M5 16 V23" />
            </g>
            <!-- Plated Through-Hole Micro-Vias -->
            <g fill="#091514" stroke="#fbbf24" stroke-width="1.1">
              <circle cx="-39" cy="-14" r="1.6" />
              <circle cx="-39" cy="0" r="1.6" />
              <circle cx="-39" cy="14" r="1.6" />
              <circle cx="39" cy="-14" r="1.6" />
              <circle cx="39" cy="0" r="1.6" />
              <circle cx="39" cy="14" r="1.6" />
            </g>

            <!-- Crisp Gold QFN Package Pins (3 per side) -->
            <g stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round">
              <line x1="-18.5" y1="-7" x2="-15" y2="-7" />
              <line x1="-18.5" y1="0" x2="-15" y2="0" />
              <line x1="-18.5" y1="7" x2="-15" y2="7" />
              <line x1="15" y1="-7" x2="18.5" y2="-7" />
              <line x1="15" y1="0" x2="18.5" y2="0" />
              <line x1="15" y1="7" x2="18.5" y2="7" />
              <line x1="-7" y1="-18.5" x2="-7" y2="-15" />
              <line x1="0" y1="-18.5" x2="0" y2="-15" />
              <line x1="7" y1="-18.5" x2="7" y2="-15" />
              <line x1="-7" y1="15" x2="-7" y2="18.5" />
              <line x1="0" y1="15" x2="0" y2="18.5" />
              <line x1="7" y1="15" x2="7" y2="18.5" />
            </g>

            <!-- Emerald Interposer Substrate + Gold Pin-1 Fiducial -->
            <rect x="-15" y="-15" width="30" height="30" rx="2.5" fill="#065f46" stroke="#34d399" stroke-width="1.15" />
            <polygon points="-13.2,-13.2 -9,-13.2 -13.2,-9" fill="#fbbf24" />

            <!-- Exposed Multi-Core Silicon Die Floorplan -->
            <rect x="-10" y="-10" width="20" height="20" rx="1.5" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />
            <!-- Compute Core Cluster A & B (Cyan) -->
            <rect x="-8" y="-8" width="7.2" height="7.2" rx="0.8" fill="#1d4ed8" stroke="#38bdf8" stroke-width="0.7" />
            <rect x="0.8" y="-8" width="7.2" height="7.2" rx="0.8" fill="#1d4ed8" stroke="#38bdf8" stroke-width="0.7" />
            <!-- Shared SRAM Cache Bank (Violet) -->
            <rect x="-8" y="0.8" width="9.8" height="7.2" rx="0.8" fill="#3730a3" stroke="#a78bfa" stroke-width="0.7" />
            <!-- Cadence Red High-Speed SerDes / PHY Block -->
            <rect x="3.4" y="0.8" width="4.6" height="7.2" rx="0.8" fill="#b91c1c" stroke="#f87171" stroke-width="0.7" />
          </g>
        </g>
        <circle cx="456" cy="177" r="6" class="xray-pin" />
      </g>

      <!-- 2B. S&P GLOBAL — STOCK TICKER FRAME (Bottom-Center, Hard-Edged Offset Shadow) -->

        <g>
          <rect x="548" y="146" width="116" height="74" rx="4" fill="#1e2028" opacity="0.2" />
          <!-- Matte Black Frame + Dark OLED Chart -->
          <rect x="542" y="140" width="116" height="74" rx="4" fill="#18181b" stroke="#09090b" stroke-width="1.2" />
          <rect x="549" y="147" width="102" height="60" rx="2" fill="#090f1a" stroke="#1e293b" stroke-width="1" />

        <circle cx="600" cy="177" r="6" class="xray-pin" />

      <!-- 2C. PLAYSTATION — PS5 CONTROLLER FRAME (Bottom-Right, Hard-Edged Offset Shadow) -->
      <g class="clickable-item" data-id="playstation" data-label="PlayStation — PS5 Controller" tabindex="0" role="button">
        <g>
          <rect x="692" y="146" width="116" height="74" rx="4" fill="#1e2028" opacity="0.2" />
          <!-- Matte Black Frame + Sony Blueprint Navy Backing -->
          <rect x="686" y="140" width="116" height="74" rx="4" fill="#18181b" stroke="#09090b" stroke-width="1.2" />
          <rect x="693" y="147" width="102" height="60" rx="2" fill="url(#ps5-blueprint-grad)" stroke="#1e4976" stroke-width="1" />

          <!-- Minimal Blueprint Corner Registration Ticks -->
          <path d="M699 156 V152 H703 M785 152 H789 V156 M699 198 V202 H703 M785 202 H789 V198" fill="none" stroke="rgba(186,230,253,0.38)" stroke-width="1" stroke-linecap="round" />

          <!-- Centered PS5 DualSense Controller -->
